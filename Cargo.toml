[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "Apache-2.0"
repository = "https://github.com/OWNER/pasteproof"
description = "Detects ClickFix-style 'paste this command' attacks before they run."
keywords = ["security", "clickfix", "shell", "malware", "terminal"]
categories = ["command-line-utilities"]

# Small, fast release binaries: one codegen unit, full LTO, no debug symbols.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Size-optimised profile for the future WebAssembly build.
[profile.release-small]
inherits = "release"
opt-level = "z"

# Benchmarks keep symbols so profilers can attribute time.
[profile.bench]
inherits = "release"
strip = "none"
debug = "line-tables-only"
